name: iOS Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-15
    name: Xcode 16.4 (macos-15)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install Cordova and dependencies
        run: |
          npm install -g cordova
          npm ci

      - name: Create and prepare test project
        run: |
          cordova create "$RUNNER_TEMP/testapp" com.test.purchaseci TestApp
          cd "$RUNNER_TEMP/testapp"
          cordova platform add ios
          cordova plugin add "$GITHUB_WORKSPACE"
          cordova prepare ios

      - name: Build iOS
        working-directory: ${{ runner.temp }}/testapp/platforms/ios
        run: >
          xcodebuild build
          -workspace App.xcworkspace
          -scheme App
          -sdk iphoneos
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
