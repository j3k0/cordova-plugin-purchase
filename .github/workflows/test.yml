name: Unit Tests & Type Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the vendored iaptic-js types are in sync
        run: |
          make sync-iaptic-js
          git diff --exit-code -- src/ts/platforms/iaptic-js/iaptic-js-types.d.ts

      - name: Compile TypeScript
        run: make compile

      - name: Run tests
        run: npm test
